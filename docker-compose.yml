version: '3.8'

services:

  # MariaDB 10.6
  mariadb:
    image: mariadb:10.6
    container_name: trade-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trade
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - trade-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: trade-redis
    ports:
      - "6379:6379"
    networks:
      - trade-network

  # Application (Tomcat 9 + WAR)
  app:
    build: .
    container_name: trade-app
    ports:
      - "8080:8080"
    environment:
      TRADE_DB_URL: jdbc:mariadb://mariadb:3306/trade
      TRADE_DB_USER: root
      TRADE_DB_PASS: root
      TRADE_REDIS_HOST: redis
      TRADE_REDIS_PORT: 6379
    depends_on:
      - mariadb
      - redis
    networks:
      - trade-network

volumes:
  mariadb-data:

networks:
  trade-network:
    driver: bridge
