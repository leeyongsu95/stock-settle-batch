# ============================================
# MariaDB DataSource
# ============================================
# [운영 반영 시] DB 접속 정보는 Jasypt 등으로 암호화하거나,
# 환경변수(TRADE_DB_URL, TRADE_DB_USER, TRADE_DB_PASS)로 주입하여
# properties 파일에 평문 노출을 방지할 것.
# 현재는 로컬 개발 환경이므로 평문으로 관리한다.
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://localhost:3306/trade
db.username=root
db.password=root

# ============================================
# HikariCP Connection Pool
# ============================================
db.pool.maximum-pool-size=10
db.pool.minimum-idle=5
db.pool.connection-timeout=30000

# ============================================
# JPA / Hibernate
# ============================================
jpa.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
jpa.hibernate.show-sql=true
jpa.hibernate.format-sql=true
jpa.hibernate.hbm2ddl-auto=validate

# ============================================
# Redis
# ============================================
redis.host=localhost
redis.port=6379
redis.timeout=3000
