# ============================================
# H2 In-Memory Database (테스트 전용)
# ============================================
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:trade_test;DB_CLOSE_DELAY=-1;MODE=MySQL
db.username=sa
db.password=

# ============================================
# HikariCP
# ============================================
db.pool.maximum-pool-size=5
db.pool.minimum-idle=2
db.pool.connection-timeout=10000

# ============================================
# JPA / Hibernate
# ============================================
jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect
jpa.hibernate.show-sql=true
jpa.hibernate.format-sql=true
jpa.hibernate.hbm2ddl-auto=create-drop

# ============================================
# Redis (테스트 시 Embedded Redis 또는 Mock 사용)
# ============================================
redis.host=localhost
redis.port=6379
redis.timeout=1000
